<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="無料枠の期間の比較図">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(140,78%,25%)"/>
			<stop offset="1" stop-color="hsl(140,58%,55%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(30,78%,25%)"/>
			<stop offset="1" stop-color="hsl(30,58%,55%)"/>
		</linearGradient>
		<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(0,78%,25%)"/>
			<stop offset="1" stop-color="hsl(0,58%,55%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<text x="10" y="22" font-size="14" font-weight="700" fill="#1c2330">無料で使える期間（横幅＝期間の長さ）</text>

	<text x="10" y="63" font-size="13" fill="#1c2330">Oracle A1 2C/12GB</text>
	<rect x="190" y="48" width="690" height="24" rx="4" fill="url(#i1)"/>
	<text x="204" y="65" font-size="12.5" fill="#ffffff" font-weight="700">無期限（Always Free）</text>

	<text x="10" y="103" font-size="13" fill="#1c2330">GCP e2-micro 1GB</text>
	<rect x="190" y="88" width="690" height="24" rx="4" fill="url(#i1)"/>
	<text x="204" y="105" font-size="12.5" fill="#ffffff" font-weight="700">無期限（Always Free）</text>

	<text x="10" y="143" font-size="13" fill="#1c2330">AWS t4g.small 2GB</text>
	<rect x="190" y="128" width="330" height="24" rx="4" fill="url(#i2)"/>
	<text x="204" y="145" font-size="12.5" fill="#ffffff" font-weight="700">2026-12-31 まで</text>

	<text x="10" y="183" font-size="13" fill="#1c2330">Azure B2pts v2 4GB</text>
	<rect x="190" y="168" width="300" height="24" rx="4" fill="url(#i2)"/>
	<text x="204" y="185" font-size="12.5" fill="#ffffff" font-weight="700">12ヶ月</text>

	<text x="10" y="223" font-size="13" fill="#1c2330">AWS $100〜200</text>
	<rect x="190" y="208" width="150" height="24" rx="4" fill="url(#i3)"/>
	<text x="204" y="225" font-size="12.5" fill="#ffffff" font-weight="700">6ヶ月</text>

	<text x="10" y="263" font-size="13" fill="#1c2330">GCP $300</text>
	<rect x="190" y="248" width="76" height="24" rx="4" fill="url(#i3)"/>
	<text x="272" y="265" font-size="12.5" fill="#1c2330">90日</text>

	<text x="10" y="293" font-size="11.5" fill="#4a5568">※ 緑＝無期限、橙＝1年前後、赤＝短期。Azureの$200/30日とさくらの2週間お試しは図から省いた。</text>
