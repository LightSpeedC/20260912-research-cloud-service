	<text x="8" y="253" font-size="11" fill="#1c2330">AWS r7i（東京）</text>
	<text x="200" y="245" font-size="10" fill="#4a5568" text-anchor="end">16GB</text>
	<rect x="206" y="236" width="194" height="12" rx="2" fill="url(#i5)"/>
	<text x="406" y="245" font-size="10" fill="#1c2330">18,600円</text>
	<text x="200" y="260" font-size="10" fill="#4a5568" text-anchor="end">32GB</text>
	<rect x="206" y="251" width="385" height="12" rx="2" fill="url(#i5)"/>
