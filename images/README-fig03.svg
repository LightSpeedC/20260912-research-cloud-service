	<rect x="206" y="288" width="600" height="12" rx="2" fill="url(#i6)"/>
	<text x="812" y="297" font-size="10" fill="#1c2330">57,600円</text>

	<text x="8" y="322" font-size="11.5" fill="#4a5568">※ Oracle・さくらのクラウド・AWS・Azure はディスク代が別に乗る。Hetzner・さくらのVPS は込み。</text>
