	<text x="8" y="216" font-size="11" fill="#1c2330">さくらのVPS（石狩）</text>
	<text x="200" y="208" font-size="10" fill="#4a5568" text-anchor="end">16GB</text>
	<rect x="206" y="199" width="138" height="12" rx="2" fill="url(#i4)"/>
	<text x="350" y="208" font-size="10" fill="#1c2330">13,200円</text>
	<text x="200" y="223" font-size="10" fill="#4a5568" text-anchor="end">32GB</text>
	<rect x="206" y="214" width="275" height="12" rx="2" fill="url(#i4)"/>
