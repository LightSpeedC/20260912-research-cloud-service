	<rect width="100%" height="100%" fill="#ffffff"/>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<text x="10" y="22" font-size="14" font-weight="700" fill="#1c2330">同じ事業者でメモリを変えたときの月額（円換算・横幅＝月額）</text>
	<text x="10" y="42" font-size="11.5" fill="#4a5568">上の2社は12GBも選べる。左端の数字が選んだメモリ量（GB）</text>

	<text x="8" y="82" font-size="11" fill="#1c2330">Oracle A1（2 OCPU）</text>
	<text x="200" y="67" font-size="10" fill="#4a5568" text-anchor="end">12GB</text>
	<rect x="206" y="58" width="46" height="12" rx="2" fill="url(#i1)"/>
	<text x="258" y="67" font-size="10" fill="#1c2330">4,411円</text>
	<text x="200" y="82" font-size="10" fill="#4a5568" text-anchor="end">16GB</text>
	<rect x="206" y="73" width="53" height="12" rx="2" fill="url(#i1)"/>
	<text x="265" y="82" font-size="10" fill="#1c2330">5,107円</text>
	<text x="200" y="97" font-size="10" fill="#4a5568" text-anchor="end">32GB</text>
	<rect x="206" y="88" width="82" height="12" rx="2" fill="url(#i1)"/>
	<text x="294" y="97" font-size="10" fill="#1c2330">7,893円</text>

	<text x="8" y="134" font-size="11" fill="#1c2330">さくらのクラウド 石狩1</text>
	<text x="200" y="119" font-size="10" fill="#4a5568" text-anchor="end">12GB</text>
	<rect x="206" y="110" width="113" height="12" rx="2" fill="url(#i2)"/>
	<text x="325" y="119" font-size="10" fill="#1c2330">10,890円</text>
	<text x="200" y="134" font-size="10" fill="#4a5568" text-anchor="end">16GB</text>
	<rect x="206" y="125" width="151" height="12" rx="2" fill="url(#i2)"/>
	<text x="363" y="134" font-size="10" fill="#1c2330">14,520円</text>
	<text x="200" y="149" font-size="10" fill="#4a5568" text-anchor="end">32GB</text>
	<rect x="206" y="140" width="272" height="12" rx="2" fill="url(#i2)"/>
